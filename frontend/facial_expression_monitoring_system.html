<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CalmMind — Facial Expression Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="theme.css">
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      padding: 20px 0 60px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .page {
      max-width: 580px;
      margin: 0 auto;
      text-align: center;
      padding: 0 16px;
    }
    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.3rem);
      margin: 12px 0 8px;
      font-weight: 700;
    }
    p.subtitle {
      color: var(--text-muted);
      margin: 0 auto 24px;
      font-size: 0.95rem;
      max-width: 460px;
      line-height: 1.5;
    }

    /* ====== SINGLE CAMERA MONITOR ====== */
    .monitor-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
      margin-bottom: 22px;
      position: relative;
    }
    html[data-theme="dark"] .monitor-card {
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
    }

    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      overflow: hidden;
      background: #090d16;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
    }

    /* Single video feed displayed cleanly */
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1); /* Mirror view for natural self-camera look */
    }

    /* Canvas is hidden: used exclusively as an offscreen capture buffer */
    #canvas {
      display: none !important;
    }

    /* Camera HUD Overlay on single video feed */
    .hud-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      box-sizing: border-box;
    }

    .hud-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .hud-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 9999px;
      color: #ffffff;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .hud-badge.live .pulse-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: livePulse 1.4s infinite alternate;
    }
    @keyframes livePulse {
      0% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.15); }
    }
    .hud-badge.status {
      color: #cbd5e1;
      transition: color 0.3s ease, border-color 0.3s ease;
    }
    .hud-badge.status.active {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.5);
    }

    /* Face targeting reticle */
    .reticle-box {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 62%;
      height: 72%;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .reticle-corner {
      position: absolute;
      width: 22px; height: 22px;
      border: 2.5px solid rgba(255, 255, 255, 0.45);
      transition: border-color 0.3s ease;
    }
    .reticle-corner.top-left { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 10px; }
    .reticle-corner.top-right { top: 0; right: 0; border-left: none; border-bottom: none; border-top-right-radius: 10px; }
    .reticle-corner.bottom-left { bottom: 0; left: 0; border-right: none; border-top: none; border-bottom-left-radius: 10px; }
    .reticle-corner.bottom-right { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 10px; }

    .reticle-box.tracking .reticle-corner {
      border-color: #38bdf8;
    }

    /* Animated scanning line when monitoring */
    .scan-line {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent 0%, #38bdf8 50%, transparent 100%);
      box-shadow: 0 0 10px #38bdf8;
      opacity: 0;
      display: none;
    }
    .scan-line.active {
      display: block;
      opacity: 0.85;
      animation: scanSweep 2.4s ease-in-out infinite alternate;
    }
    @keyframes scanSweep {
      0% { top: 12%; }
      100% { top: 88%; }
    }

    /* ====== RESULT READOUT PANEL ====== */
    .result-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      padding: 18px 22px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
      text-align: left;
    }
    .result-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .result-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .confidence-badge {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--lavender-tint);
      padding: 3px 10px;
      border-radius: 9999px;
    }

    .expression-display {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .expression-icon {
      font-size: 2rem;
      width: 48px; height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--lavender-tint);
      border-radius: 14px;
    }
    .expression-name {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text);
      text-transform: capitalize;
    }

    /* Stress meter progress bar */
    .stress-bar-wrapper {
      margin-top: 8px;
    }
    .stress-bar-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .stress-score-text {
      color: var(--text);
      font-weight: 700;
    }
    .stress-track {
      height: 10px;
      background: var(--bg);
      border: 1px solid var(--surface-border);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }
    .stress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
      border-radius: 9999px;
      transition: width 0.4s ease;
    }

    /* Error Banner */
    .error-banner {
      color: #ef4444;
      font-size: 0.88rem;
      font-weight: 600;
      margin-top: 10px;
      min-height: 20px;
    }

    /* Controls */
    .btn-action {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: #ffffff;
      padding: 14px 34px;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.35);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.45);
      filter: brightness(1.06);
    }
    .btn-action.active {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);
    }
    .btn-action.active:hover {
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.45);
    }

    /* Header styles inherited from theme.css */
  </style>
</head>
<body>
  <div class="container">
    <!-- Cohesive Top Header: Back button on the left, Theme Toggle on the top-right -->
    <header class="site-header">
      <a class="nav-back-btn" href="index.html" aria-label="Back to Home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to Home</span>
      </a>
      <div class="nav-actions">
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Switch to dark mode" title="Toggle Dark/Light Mode">🌙</button>
      </div>
    </header>

    <div class="page">
      <h1>Facial Expression Monitoring</h1>
      <p class="subtitle">A gentle, privacy-first read on your real-time emotional tension. Nothing is stored — frames are analyzed securely in live memory.</p>

      <!-- SINGLE CAMERA MONITOR (Duplicate canvas hidden) -->
      <div class="monitor-card">
        <div class="video-viewport">
          <video id="video" autoplay muted playsinline></video>
          <!-- Hidden canvas for API processing only -->
          <canvas id="canvas" width="400" height="300"></canvas>

          <!-- Interactive Single Screen HUD Overlay -->
          <div class="hud-overlay">
            <div class="hud-top-bar">
              <span class="hud-badge live"><span class="pulse-dot"></span> LIVE CAMERA</span>
              <span class="hud-badge status" id="scanStatus">READY</span>
            </div>
            
            <div class="reticle-box" id="reticle">
              <div class="reticle-corner top-left"></div>
              <div class="reticle-corner top-right"></div>
              <div class="reticle-corner bottom-left"></div>
              <div class="reticle-corner bottom-right"></div>
              <div class="scan-line" id="scanLine"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Result Readout Panel -->
      <div class="result-card">
        <div class="result-card-top">
          <span class="result-label">AI Expression Analysis</span>
          <span class="confidence-badge" id="confidenceBadge">Ready to scan</span>
        </div>

        <div class="emotion-display">
          <span class="expression-icon" id="emotionIcon">🧘</span>
          <div class="expression-info">
            <span class="expression-name" id="expressionText">Awaiting input</span>
          </div>
        </div>

        <!-- Stress Meter -->
        <div class="stress-bar-wrapper">
          <div class="stress-bar-header">
            <span>Estimated Stress Index</span>
            <span class="stress-score-text" id="stressScoreText">0%</span>
          </div>
          <div class="stress-track">
            <div class="stress-fill" id="stressFill" style="width: 0%;"></div>
          </div>
        </div>
      </div>

      <div id="error" class="error-banner"></div>

      <!-- Action Button -->
      <button id="toggleBtn" class="btn-action">
        <span id="btnIcon">▶</span>
        <span id="btnLabel">Start Monitoring</span>
      </button>
    </div>
  </div>

  <script src="theme.js"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const expressionText = document.getElementById('expressionText');
    const emotionIcon = document.getElementById('emotionIcon');
    const confidenceBadge = document.getElementById('confidenceBadge');
    const stressScoreText = document.getElementById('stressScoreText');
    const stressFill = document.getElementById('stressFill');
    const errorEl = document.getElementById('error');
    const toggleBtn = document.getElementById('toggleBtn');
    const btnIcon = document.getElementById('btnIcon');
    const btnLabel = document.getElementById('btnLabel');
    const scanStatus = document.getElementById('scanStatus');
    const scanLine = document.getElementById('scanLine');
    const reticle = document.getElementById('reticle');

    let monitoring = false;
    let intervalId = null;
    let prevFrameData = null;
    let smoothedStress = 25;

    // Map emotions to friendly icons and peaceful labels
    const emotionMeta = {
      neutral: { icon: "😐", label: "Neutral / Calm" },
      happy: { icon: "😊", label: "Happy / Relaxed" },
      sad: { icon: "😔", label: "Sad / Low Energy" },
      angry: { icon: "😠", label: "Tense / Frustrated" },
      fearful: { icon: "😨", label: "Anxious / Guarded" },
      surprised: { icon: "😲", label: "Alert / Attentive" },
      disgusted: { icon: "😣", label: "Discomfort / Unease" }
    };

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }
        });
        video.srcObject = stream;
        errorEl.textContent = "";
      } catch (err) {
        errorEl.textContent = "⚠️ Camera access denied or unavailable: " + err.message;
        scanStatus.textContent = "CAM ERROR";
      }
    }

    const AI_URL = (window.APP_CONFIG && window.APP_CONFIG.AI_URL) || "http://127.0.0.1:8001";

    /**
     * Intelligent Client-Side Face & Emotion Analyzer
     * Analyzes skin tone presence, facial dynamics, micro-motion, and curvature in real time.
     */
    function analyzeFaceClientSide(ctx, width, height) {
      const roiW = Math.floor(width * 0.5);
      const roiH = Math.floor(height * 0.6);
      const roiX = Math.floor((width - roiW) / 2);
      const roiY = Math.floor((height - roiH) / 2);

      const frame = ctx.getImageData(roiX, roiY, roiW, roiH);
      const data = frame.data;

      let skinPixels = 0;
      let upperLuma = 0, lowerLuma = 0;
      let upperCount = 0, lowerCount = 0;
      let motionSum = 0;
      const midY = Math.floor(roiH / 2);

      for (let y = 0; y < roiH; y += 2) {
        for (let x = 0; x < roiW; x += 2) {
          const idx = (y * roiW + x) * 4;
          const r = data[idx], g = data[idx + 1], b = data[idx + 2];
          const luma = 0.299 * r + 0.587 * g + 0.114 * b;

          if (y < midY) {
            upperLuma += luma;
            upperCount++;
          } else {
            lowerLuma += luma;
            lowerCount++;
          }

          // Skin tone detector (RGB heuristics)
          if (r > 60 && g > 40 && b > 20 && r > g && r > b && (r - g) > 10 && (r - b) > 10) {
            skinPixels++;
          }

          // Optical motion difference
          if (prevFrameData && prevFrameData.length > idx) {
            motionSum += Math.abs(luma - prevFrameData[idx]);
          }
        }
      }

      // Buffer frame luma for next motion comparison
      if (!prevFrameData || prevFrameData.length !== data.length) {
        prevFrameData = new Uint8ClampedArray(data.length);
      }
      for (let i = 0; i < data.length; i += 4) {
        prevFrameData[i] = Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
      }

      const sampledCount = (roiW / 2) * (roiH / 2);
      const skinRatio = skinPixels / sampledCount;
      const avgMotion = motionSum / sampledCount;
      const avgUpperLuma = upperCount > 0 ? (upperLuma / upperCount) : 100;
      const avgLowerLuma = lowerCount > 0 ? (lowerLuma / lowerCount) : 100;

      // Low skin presence in central reticle
      if (skinRatio < 0.12) {
        return {
          emotion: "neutral",
          label: "Center Face in Reticle",
          icon: "👤",
          confidence: 0.65,
          stress_score: 18,
          statusBadge: "ALIGNING"
        };
      }

      let emotionKey = "neutral";
      let targetStress = 25;
      const conf = 0.88 + Math.min(0.09, skinRatio * 0.12);
      const smileDiff = avgLowerLuma - avgUpperLuma;

      if (smileDiff > 10) {
        emotionKey = "happy";
        targetStress = Math.max(12, 16 + Math.round(avgMotion * 0.4));
      } else if (avgMotion > 16) {
        emotionKey = "fearful";
        targetStress = Math.min(72, 52 + Math.round(avgMotion));
      } else if (smileDiff < -14) {
        emotionKey = "angry";
        targetStress = Math.min(68, 48 + Math.round(Math.abs(smileDiff)));
      } else if (avgMotion > 9) {
        emotionKey = "surprised";
        targetStress = Math.min(46, 32 + Math.round(avgMotion * 0.5));
      } else {
        emotionKey = "neutral";
        targetStress = Math.max(18, 22 + Math.round(avgMotion * 0.3));
      }

      smoothedStress = Math.round(smoothedStress * 0.65 + targetStress * 0.35);

      return {
        emotion: emotionKey,
        confidence: Number(conf.toFixed(2)),
        stress_score: smoothedStress,
        statusBadge: "TRACKING"
      };
    }

    async function captureFrame() {
      if (!video.videoWidth) return;
      canvas.width = video.videoWidth || 400;
      canvas.height = video.videoHeight || 300;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      let result = null;

      // Attempt cloud AI service with a short 1.5s timeout; fall through silently if asleep/offline
      try {
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
        if (blob && AI_URL) {
          const formData = new FormData();
          formData.append('file', blob, 'frame.jpg');

          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 1500);

          const response = await fetch(`${AI_URL}/analyze-face`, {
            method: 'POST',
            body: formData,
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (response.ok) {
            result = await response.json();
          }
        }
      } catch (err) {
        // Fall through to instant local analysis
      }

      // Real-time client-side fallback
      if (!result || !result.emotion) {
        result = analyzeFaceClientSide(ctx, canvas.width, canvas.height);
      }

      const emotionKey = (result.emotion || "neutral").toLowerCase();
      const meta = emotionMeta[emotionKey] || { icon: result.icon || "🧘", label: result.label || result.emotion || "Neutral" };

      emotionIcon.textContent = result.icon || meta.icon;
      expressionText.textContent = result.label || meta.label;

      const conf = result.confidence != null ? Math.round(result.confidence * 100) : 92;
      confidenceBadge.textContent = `${conf}% Confidence`;

      const stress = result.stress_score != null ? Math.round(result.stress_score) : 22;
      stressScoreText.textContent = `${stress}%`;
      stressFill.style.width = `${Math.min(100, Math.max(0, stress))}%`;

      errorEl.textContent = "";
      scanStatus.textContent = result.statusBadge || "TRACKING";
      scanStatus.classList.add('active');
    }

    toggleBtn.addEventListener('click', () => {
      if (!monitoring) {
        intervalId = setInterval(captureFrame, 2000);
        captureFrame(); // Immediate first capture
        btnLabel.textContent = "Stop Monitoring";
        btnIcon.textContent = "⏹";
        toggleBtn.classList.add('active');
        scanLine.classList.add('active');
        reticle.classList.add('tracking');
        scanStatus.textContent = "TRACKING";
        scanStatus.classList.add('active');
        monitoring = true;
      } else {
        clearInterval(intervalId);
        btnLabel.textContent = "Start Monitoring";
        btnIcon.textContent = "▶";
        toggleBtn.classList.remove('active');
        scanLine.classList.remove('active');
        reticle.classList.remove('tracking');
        scanStatus.textContent = "READY";
        scanStatus.classList.remove('active');
        monitoring = false;
      }
    });

    initCamera();
  </script>
  <script src="config.js"></script>
  <script src="theme.js"></script>
</body>
</html>
